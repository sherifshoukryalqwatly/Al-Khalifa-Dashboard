<div class="container-fluid">
  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h4 class="fw-semibold mb-0">
      {{ 'STORE_SETTINGS.TITLE' | translate }}
    </h4>
  </div>
  <!-- Breadcrumb -->
   <nav aria-label="breadcrumb" [class.rtl]="isRtl">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item">
          <a routerLink="/settings">{{ 'STORE_SETTINGS.BREADCRUMB.GENERAL' | translate }}</a>
        </li>
        <li class="breadcrumb-item active">
          {{ 'STORE_SETTINGS.BREADCRUMB.STORE' | translate }}
        </li>
      </ol>
    </nav>

  <div class="card mt-4">
    <div class="card-body">
      <form>

        <div class="mb-3">
          <label class="form-label">
            {{ 'STORE_SETTINGS.FIELDS.NAME' | translate }}
          </label>
          <input type="text" class="form-control" placeholder="Enter store name" />
        </div>

        <div class="mb-3">
          <label class="form-label">
            {{ 'STORE_SETTINGS.FIELDS.EMAIL' | translate }}
          </label>
          <input type="email" class="form-control" placeholder="store@example.com" />
        </div>

        <div class="mb-3">
          <label class="form-label">
            {{ 'STORE_SETTINGS.FIELDS.PHONE' | translate }}
          </label>
          <input type="text" class="form-control" placeholder="Enter phone number" />
        </div>

        <div class="mb-3">
          <label class="form-label">
            {{ 'STORE_SETTINGS.FIELDS.ADDRESS' | translate }}
          </label>
          <textarea class="form-control" rows="3" placeholder="Enter store address"></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">
            {{ 'STORE_SETTINGS.FIELDS.CURRENCY' | translate }}
          </label>
          <select class="form-select">
            <option>USD</option>
            <option>EUR</option>
            <option>EGP</option>
          </select>
        </div>

        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-success">
            <i class="bi bi-save me-2"></i>
            {{ 'COMMON.SAVE_CHANGES' | translate }}
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
