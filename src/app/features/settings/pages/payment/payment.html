<div class="container-fluid">

  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h4 class="fw-semibold mb-0">
      {{ 'PAYMENT_SETTINGS.TITLE' | translate }}
    </h4>
  </div>
  <!-- Breadcrumb -->
   <nav aria-label="breadcrumb" [class.rtl]="isRtl">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item">
          <a routerLink="/settings">{{ 'PAYMENT_SETTINGS.BREADCRUMB.GENERAL' | translate }}</a>
        </li>
        <li class="breadcrumb-item active">
          {{ 'PAYMENT_SETTINGS.BREADCRUMB.PAYMENT' | translate }}
        </li>
      </ol>
    </nav>

  <div class="card mt-4">
    <div class="card-body">
      <form>

        <div class="mb-3">
          <label class="form-label">
            {{ 'PAYMENT_SETTINGS.FIELDS.DEFAULT_GATEWAY' | translate }}
          </label>
          <select class="form-select">
            <option>Stripe</option>
            <option>PayPal</option>
            <option>Paymob</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">
            {{ 'PAYMENT_SETTINGS.FIELDS.STRIPE_KEY' | translate }}
          </label>
          <input type="text" class="form-control" placeholder="Enter Stripe API Key" />
        </div>

        <div class="mb-3">
          <label class="form-label">
            {{ 'PAYMENT_SETTINGS.FIELDS.PAYPAL_CLIENT' | translate }}
          </label>
          <input type="text" class="form-control" placeholder="Enter PayPal Client ID" />
        </div>

        <div class="mb-3">
          <label class="form-label">
            {{ 'PAYMENT_SETTINGS.FIELDS.PAYPAL_SECRET' | translate }}
          </label>
          <input type="text" class="form-control" placeholder="Enter PayPal Secret" />
        </div>

        <div class="mb-3">
          <label class="form-label">
            {{ 'PAYMENT_SETTINGS.FIELDS.PAYMOB_KEY' | translate }}
          </label>
          <input type="text" class="form-control" placeholder="Enter Paymob API Key" />
        </div>

        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-success">
            <i class="bi bi-save me-2"></i>
            {{ 'COMMON.SAVE_CHANGES' | translate }}
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
