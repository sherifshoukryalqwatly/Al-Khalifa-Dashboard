<div class="container-fluid">
  
  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h4 class="fw-semibold mb-0">
      {{ 'EMAIL_SETTINGS.TITLE' | translate }}
    </h4>
  </div>
  <!-- Breadcrumb -->
   <nav aria-label="breadcrumb" [class.rtl]="isRtl">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item">
          <a routerLink="/settings">{{ 'EMAIL_SETTINGS.BREADCRUMB.GENERAL' | translate }}</a>
        </li>
        <li class="breadcrumb-item active">
          {{ 'EMAIL_SETTINGS.BREADCRUMB.EMAIL' | translate }}
        </li>
      </ol>
    </nav>

  <div class="card mt-4">
    <div class="card-body">
      <form>

        <div class="mb-3">
          <label class="form-label">
            {{ 'EMAIL_SETTINGS.FIELDS.DRIVER' | translate }}
          </label>
          <select class="form-select">
            <option>SMTP</option>
            <option>SendGrid</option>
            <option>Mailgun</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">
            {{ 'EMAIL_SETTINGS.FIELDS.HOST' | translate }}
          </label>
          <input type="text" class="form-control" placeholder="smtp.mailserver.com" />
        </div>

        <div class="mb-3">
          <label class="form-label">
            {{ 'EMAIL_SETTINGS.FIELDS.PORT' | translate }}
          </label>
          <input type="number" class="form-control" placeholder="587" />
        </div>

        <div class="mb-3">
          <label class="form-label">
            {{ 'EMAIL_SETTINGS.FIELDS.USERNAME' | translate }}
          </label>
          <input type="text" class="form-control" placeholder="user@mail.com" />
        </div>

        <div class="mb-3">
          <label class="form-label">
            {{ 'EMAIL_SETTINGS.FIELDS.PASSWORD' | translate }}
          </label>
          <input type="password" class="form-control" placeholder="********" />
        </div>

        <div class="mb-3">
          <label class="form-label">
            {{ 'EMAIL_SETTINGS.FIELDS.ENCRYPTION' | translate }}
          </label>
          <select class="form-select">
            <option>TLS</option>
            <option>SSL</option>
            <option>None</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">
            {{ 'EMAIL_SETTINGS.FIELDS.FROM_ADDRESS' | translate }}
          </label>
          <input type="email" class="form-control" placeholder="noreply@example.com" />
        </div>

        <div class="mb-3">
          <label class="form-label">
            {{ 'EMAIL_SETTINGS.FIELDS.FROM_NAME' | translate }}
          </label>
          <input type="text" class="form-control" placeholder="Site Name" />
        </div>

        <div class="d-flex justify-content-end">
          <button type="submit" class="btn btn-success">
            <i class="bi bi-save me-2"></i>
            {{ 'COMMON.SAVE_CHANGES' | translate }}
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
