<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
  <div class="p-3">
    <h4 class="fw-bold mb-4">
      {{ 'SHIPPING_ZONE_ADD.TITLE' | translate }}
    </h4>
    <nav aria-label="breadcrumb" [class.rtl]="isRtl">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item">
          <a routerLink="/shipping">{{ 'SHIPPING_ZONE_ADD.BREADCRUMB.SHIPPING' | translate }}</a>
        </li>
        <li class="breadcrumb-item">
          <a routerLink="/shipping/zones">{{ 'SHIPPING_ZONE_ADD.BREADCRUMB.ZONES' | translate }}</a>
        </li>
        <li class="breadcrumb-item active">
          {{ 'SHIPPING_ZONE_ADD.BREADCRUMB.ADD' | translate }}
        </li>
      </ol>
    </nav>
  </div>
</div>

<form class="row justify-content-center" (ngSubmit)="createZone()">
  <div class="col-lg-6">

    <div class="card shadow-sm border-0">
      <div class="card-body">

        <div class="mb-3">
          <label class="form-label fw-semibold">
            {{ 'SHIPPING_ZONE_ADD.FIELDS.NAME' | translate }}
          </label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="zone.name"
            name="name"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">
            {{ 'SHIPPING_ZONE_ADD.FIELDS.FEE' | translate }}
          </label>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="zone.fee"
            name="fee"
            min="0"
          />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">
            {{ 'SHIPPING_ZONE_ADD.FIELDS.DELIVERY' | translate }}
          </label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="zone.delivery"
            name="delivery"
            placeholder="e.g. 2-3 Days"
          />
        </div>

        <div class="form-check mb-4">
          <input
            class="form-check-input"
            type="checkbox"
            [(ngModel)]="zone.active"
            name="active"
          />
          <label class="form-check-label">
            {{ 'SHIPPING_ZONE_ADD.FIELDS.ACTIVE' | translate }}
          </label>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 mb-2"
          [disabled]="!zone.name"
        >
          <i class="bi bi-check-circle me-1"></i>
          {{ 'COMMON.SAVE' | translate }}
        </button>

        <a routerLink="/shipping/zones" class="btn btn-outline-secondary w-100">
          {{ 'COMMON.CANCEL' | translate }}
        </a>

      </div>
    </div>

  </div>
</form>
