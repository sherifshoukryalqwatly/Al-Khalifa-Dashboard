<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap">
  <div>
    <h4 class="fw-bold mb-1">
      {{ 'SHIPPING_EDIT.TITLE' | translate }}
    </h4>
    <nav aria-label="breadcrumb" [class.rtl]="isRtl">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item">
          <a routerLink="/shipping">{{ 'SHIPPING_EDIT.BREADCRUMB.SHIPPING' | translate }}</a>
        </li>
        <li class="breadcrumb-item active">
          {{ 'SHIPPING_EDIT.BREADCRUMB.EDIT' | translate }}
        </li>
      </ol>
    </nav>
  </div>

  <a routerLink="/shipping/zones/add" class="btn btn-primary">
    <i class="bi bi-plus-circle me-1"></i>
    {{ 'SHIPPING_EDIT.ACTIONS.ADD_ZONE' | translate }}
  </a>
</div>

<form class="row justify-content-center" [formGroup]="form" (ngSubmit)="save()">

  <div class="col-lg-6">

    <div class="row g-3">

      <div class="col-md-6">
        <label>{{ 'SHIPPING_EDIT.FIELDS.FULL_NAME' | translate }}</label>
        <input class="form-control" formControlName="fullName">
      </div>

      <div class="col-md-6">
        <label>{{ 'SHIPPING_EDIT.FIELDS.PHONE' | translate }}</label>
        <input class="form-control" formControlName="phone">
      </div>

      <div class="col-md-12">
        <label>{{ 'SHIPPING_EDIT.FIELDS.ADDRESS1' | translate }}</label>
        <input class="form-control" formControlName="addressLine1">
      </div>

      <div class="col-md-12">
        <label>{{ 'SHIPPING_EDIT.FIELDS.ADDRESS2' | translate }}</label>
        <input class="form-control" formControlName="addressLine2">
      </div>

      <div class="col-md-4">
        <label>{{ 'SHIPPING_EDIT.FIELDS.CITY' | translate }}</label>
        <input class="form-control" formControlName="city">
      </div>

      <div class="col-md-4">
        <label>{{ 'SHIPPING_EDIT.FIELDS.STATE' | translate }}</label>
        <input class="form-control" formControlName="state">
      </div>

      <div class="col-md-4">
        <label>{{ 'SHIPPING_EDIT.FIELDS.POSTAL' | translate }}</label>
        <input class="form-control" formControlName="postalCode">
      </div>

      <div class="col-md-6">
        <label>{{ 'SHIPPING_EDIT.FIELDS.COUNTRY' | translate }}</label>
        <input class="form-control" formControlName="country">
      </div>

      <div class="col-md-12">
        <label>{{ 'SHIPPING_EDIT.FIELDS.NOTES' | translate }}</label>
        <textarea class="form-control" rows="3" formControlName="deliveryNotes"></textarea>
      </div>

    </div>

    <button class="btn btn-primary w-100 mt-3" type="submit">
      <i class="bi bi-save me-1"></i>
      {{ 'COMMON.SAVE' | translate }}
    </button>

  </div>
</form>
