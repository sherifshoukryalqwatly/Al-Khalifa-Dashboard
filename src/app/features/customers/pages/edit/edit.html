<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h4 class="fw-bold mb-1">{{ 'EDIT_USER.TITLE' | translate }}</h4>
    <nav aria-label="breadcrumb" [class.rtl]="isRtl">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item">
          <a routerLink="/customers">{{ 'EDIT_USER.BREADCRUMB.USERS' | translate }}</a>
        </li>
        <li class="breadcrumb-item active">
          {{ 'EDIT_USER.BREADCRUMB.EDIT' | translate }}
        </li>
      </ol>
    </nav>
  </div>
</div>

<form class="row justify-content-center" (ngSubmit)="updateUser()">
  <div class="col-lg-6">

    <div class="card shadow-sm border-0">
      <div class="card-body">

        <div class="mb-3">
          <label class="form-label fw-semibold">{{ 'EDIT_USER.FIELD.NAME' | translate }}</label>
          <input type="text" class="form-control" [(ngModel)]="user.name" name="name" />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">{{ 'EDIT_USER.FIELD.EMAIL' | translate }}</label>
          <input type="email" class="form-control" [(ngModel)]="user.email" name="email" disabled />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">{{ 'EDIT_USER.FIELD.PHONE' | translate }}</label>
          <input type="text" class="form-control" [(ngModel)]="user.phone" name="phone" />
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">{{ 'EDIT_USER.FIELD.ROLE' | translate }}</label>
          <select class="form-select" [(ngModel)]="user.role" name="role">
            <option>User</option>
            <option>Admin</option>
            <option>Manager</option>
          </select>
        </div>

        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" [(ngModel)]="user.active" name="active" />
          <label class="form-check-label">{{ 'EDIT_USER.FIELD.ACTIVE' | translate }}</label>
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-2">
          <i class="bi bi-save me-1"></i>
          {{ 'EDIT_USER.ACTION.UPDATE' | translate }}
        </button>

        <a routerLink="/users" class="btn btn-outline-secondary w-100">
          {{ 'EDIT_USER.ACTION.CANCEL' | translate }}
        </a>

      </div>
    </div>

  </div>
</form>
