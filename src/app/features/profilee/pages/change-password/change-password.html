<div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-2">

  <div>
    <h4 class="fw-bold mb-1">
      {{ 'PROFILE.PASSWORD.TITLE' | translate }}
    </h4>
    <nav aria-label="breadcrumb" [class.rtl]="isRtl">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item">
          <a routerLink="/profile">{{ 'PROFILE.BREADCRUMB.PROFILE' | translate }}</a>
        </li>
        <li class="breadcrumb-item active">
          {{ 'PROFILE.PASSWORD.BREADCRUMB' | translate }}
        </li>
      </ol>
    </nav>
  </div>

  <a routerLink="/profile" class="btn btn-outline-secondary">
    {{ 'COMMON.CANCEL' | translate }}
  </a>

</div>

<div class="container-fluid">

  <div class="card">
    <div class="card-body">

      <div class="mb-3">
        <label class="form-label">
          {{ 'PROFILE.PASSWORD.CURRENT' | translate }}
        </label>
        <input type="password" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">
          {{ 'PROFILE.PASSWORD.NEW' | translate }}
        </label>
        <input type="password" class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">
          {{ 'PROFILE.PASSWORD.CONFIRM' | translate }}
        </label>
        <input type="password" class="form-control">
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a routerLink="/profile" class="btn btn-outline-secondary">
          {{ 'COMMON.CANCEL' | translate }}
        </a>
        <button class="btn btn-primary">
          {{ 'PROFILE.PASSWORD.UPDATE' | translate }}
        </button>
      </div>

    </div>
  </div>
</div>
