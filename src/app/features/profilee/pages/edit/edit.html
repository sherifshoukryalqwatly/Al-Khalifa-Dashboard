<div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-2">

  <div>
    <h4 class="fw-bold mb-1">
      {{ 'PROFILE.EDIT.TITLE' | translate }}
    </h4>
     <nav aria-label="breadcrumb" [class.rtl]="isRtl">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item">
          <a routerLink="/profile">{{ 'PROFILE.BREADCRUMB.PROFILE' | translate }}</a>
        </li>
        <li class="breadcrumb-item active">
          {{ 'PROFILE.BREADCRUMB.EDIT' | translate }}
        </li>
      </ol>
    </nav>
  </div>

  <a routerLink="/profile" class="btn btn-outline-secondary">
    {{ 'COMMON.CANCEL' | translate }}
  </a>

</div>

<div class="container-fluid">

  <div class="card">
    <div class="card-body">

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">
            {{ 'PROFILE.FIELDS.FULL_NAME' | translate }}
          </label>
          <input class="form-control" value="John Doe">
        </div>
        <div class="col-md-6">
          <label class="form-label">
            {{ 'PROFILE.FIELDS.EMAIL' | translate }}
          </label>
          <input class="form-control" value="john.doe@example.com">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">
            {{ 'PROFILE.FIELDS.PHONE' | translate }}
          </label>
          <input class="form-control" value="+1 234 567 890">
        </div>
        <div class="col-md-6">
          <label class="form-label">
            {{ 'PROFILE.FIELDS.AVATAR' | translate }}
          </label>
          <input class="form-control" placeholder="https://...">
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2">
        <a routerLink="/profile" class="btn btn-outline-secondary">
          {{ 'COMMON.CANCEL' | translate }}
        </a>
        <button class="btn btn-primary">
          {{ 'COMMON.SAVE_CHANGES' | translate }}
        </button>
      </div>

    </div>
  </div>
</div>
