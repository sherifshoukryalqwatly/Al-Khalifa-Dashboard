<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h4 class="fw-bold mb-1">
      {{ 'INVENTORY_ADD.TITLE' | translate }}
    </h4>
    <nav aria-label="breadcrumb" [class.rtl]="isRtl">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item">
          <a routerLink="/inventory">{{ 'INVENTORY_ADD.BREADCRUMB.INVENTORY' | translate }}</a>
        </li>
        <li class="breadcrumb-item active">
          {{ 'INVENTORY_ADD.BREADCRUMB.ADD' | translate }}
        </li>
      </ol>
    </nav>
  </div>
</div>

<form class="row justify-content-center" (ngSubmit)="createInventory()">
  <div class="col-lg-6">

    <div class="card shadow-sm border-0">
      <div class="card-body">

        <!-- Product Name -->
        <div class="mb-3">
          <label class="form-label fw-semibold">
            {{ 'INVENTORY_ADD.FIELDS.PRODUCT_NAME' | translate }}
          </label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="inventory.productName"
            name="productName"
            required
          />
        </div>

        <!-- SKU -->
        <div class="mb-3">
          <label class="form-label fw-semibold">
            {{ 'INVENTORY_ADD.FIELDS.SKU' | translate }}
          </label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="inventory.sku"
            name="sku"
          />
        </div>

        <!-- Quantity -->
        <div class="mb-3">
          <label class="form-label fw-semibold">
            {{ 'INVENTORY_ADD.FIELDS.QUANTITY' | translate }}
          </label>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="inventory.quantity"
            name="quantity"
            min="0"
          />
        </div>

        <!-- Low Stock Alert -->
        <div class="mb-3">
          <label class="form-label fw-semibold">
            {{ 'INVENTORY_ADD.FIELDS.LOW_STOCK' | translate }}
          </label>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="inventory.lowStock"
            name="lowStock"
            min="1"
          />
        </div>

        <!-- Location -->
        <div class="mb-3">
          <label class="form-label fw-semibold">
            {{ 'INVENTORY_ADD.FIELDS.LOCATION' | translate }}
          </label>
          <select
            class="form-select"
            [(ngModel)]="inventory.location"
            name="location"
          >
            <option value="main">
              {{ 'INVENTORY_ADD.LOCATION.MAIN' | translate }}
            </option>
            <option value="store">
              {{ 'INVENTORY_ADD.LOCATION.STORE' | translate }}
            </option>
            <option value="secondary">
              {{ 'INVENTORY_ADD.LOCATION.SECONDARY' | translate }}
            </option>
          </select>
        </div>

        <!-- Status -->
        <div class="form-check mb-4">
          <input
            class="form-check-input"
            type="checkbox"
            [(ngModel)]="inventory.active"
            name="active"
          />
          <label class="form-check-label">
            {{ 'INVENTORY_ADD.FIELDS.ACTIVE' | translate }}
          </label>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 mb-2"
          [disabled]="!inventory.productName"
        >
          <i class="bi bi-check-circle me-1"></i>
          {{ 'INVENTORY_ADD.ACTION.SAVE' | translate }}
        </button>

        <a routerLink="/inventory" class="btn btn-outline-secondary w-100">
          {{ 'COMMON.CANCEL' | translate }}
        </a>

      </div>
    </div>

  </div>
</form>
