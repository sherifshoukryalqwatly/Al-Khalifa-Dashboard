<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h4 class="fw-bold mb-1">
      {{ 'COUPON_ADD.TITLE' | translate }}
    </h4>
    <nav aria-label="breadcrumb" [class.rtl]="isRtl">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item">
          <a routerLink="/coupons">{{ 'COUPON_ADD.BREADCRUMB.COUPONS' | translate }}</a>
        </li>
        <li class="breadcrumb-item active">
          {{ 'COUPON_ADD.BREADCRUMB.ADD' | translate }}
        </li>
      </ol>
    </nav>
  </div>
</div>

<form class="row justify-content-center" (ngSubmit)="createCoupon()">
  <div class="col-lg-6">

    <div class="card shadow-sm border-0">
      <div class="card-body">

        <!-- Code -->
        <div class="mb-3">
          <label class="form-label fw-semibold">
            {{ 'COUPON_ADD.FIELDS.CODE' | translate }}
          </label>
          <input
            type="text"
            class="form-control text-uppercase"
            [(ngModel)]="coupon.code"
            name="code"
            required
          />
        </div>

        <!-- Discount -->
        <div class="mb-3">
          <label class="form-label fw-semibold">
            {{ 'COUPON_ADD.FIELDS.DISCOUNT' | translate }}
          </label>
          <input
            type="number"
            class="form-control"
            [(ngModel)]="coupon.discount"
            name="discount"
            min="1"
          />
        </div>

        <!-- Type -->
        <div class="mb-3">
          <label class="form-label fw-semibold">
            {{ 'COUPON_ADD.FIELDS.TYPE' | translate }}
          </label>
          <select
            class="form-select"
            [(ngModel)]="coupon.type"
            name="type"
          >
            <option value="percentage">
              {{ 'COUPON_ADD.TYPE.PERCENTAGE' | translate }}
            </option>
            <option value="fixed">
              {{ 'COUPON_ADD.TYPE.FIXED' | translate }}
            </option>
          </select>
        </div>

        <!-- Expiry -->
        <div class="mb-3">
          <label class="form-label fw-semibold">
            {{ 'COUPON_ADD.FIELDS.EXPIRY' | translate }}
          </label>
          <input
            type="date"
            class="form-control"
            [(ngModel)]="coupon.expiresAt"
            name="expiresAt"
          />
        </div>

        <!-- Status -->
        <div class="form-check mb-4">
          <input
            class="form-check-input"
            type="checkbox"
            [(ngModel)]="coupon.active"
            name="active"
          />
          <label class="form-check-label">
            {{ 'COUPON_ADD.FIELDS.ACTIVE' | translate }}
          </label>
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100 mb-2"
          [disabled]="!coupon.code || coupon.discount <= 0"
        >
          <i class="bi bi-check-circle me-1"></i>
          {{ 'COUPON_ADD.ACTION.SAVE' | translate }}
        </button>

        <a routerLink="/coupons" class="btn btn-outline-secondary w-100">
          {{ 'COMMON.CANCEL' | translate }}
        </a>

      </div>
    </div>

  </div>
</form>
